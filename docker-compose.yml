services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: research_agent
    ports:
      - "5433:5432"   # host 5433 -> container 5432 (avoids clashing with a local Postgres)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d research_agent"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      # Inside the compose network, the API reaches Postgres by service name "db".
      DATABASE_URL: postgresql+psycopg://agent:agent@db:5432/research_agent
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["full"]   # only starts with: docker compose --profile full up

volumes:
  pgdata:
